{% extends "auth_base.html" %}
{% block title %}Sign in — ShariahEase{% endblock %}
{% block content %}
<div class="w-full max-w-sm">
  <div class="bg-[#1c1a18] border border-[#2c2925] rounded-xl overflow-hidden flex flex-col" id="login-card">

    <!-- Error banner -->
    <div id="error-banner" class="hidden bg-[#2a1415] border-b border-[#e5484d]/30 px-5 py-3 flex items-center gap-2.5">
      <svg class="w-4 h-4 text-[#e5484d] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
      </svg>
      <span class="text-[#e5484d] text-[13px]"></span>
    </div>

    <div class="px-6 pt-6 pb-4 flex flex-col items-start">
      <a href="/" class="flex items-center gap-2 mb-5 text-[#efe9de]">
        <svg class="w-5 h-5 text-[#10b981] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
          <rect x="4.5" y="4.5" width="15" height="15" rx="2" transform="rotate(45 12 12)"/>
          <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
        </svg>
        <span class="text-[16px] font-medium tracking-[-0.01em]">ShariahEase</span>
      </a>
      <h1 class="text-[20px] font-medium text-[#efe9de]">Sign in</h1>
      <p class="text-[13px] text-[#aaa398] mt-1">Access your Zakat, expense, and screening records</p>
    </div>

    <div class="px-6 pb-6 space-y-4">
      <div class="space-y-1.5">
        <label for="email" class="block text-[12px] font-medium text-[#aaa398]">Email address</label>
        <input id="email" class="field-input min-h-[42px]" placeholder="name@example.com" required type="email" autocomplete="email"/>
      </div>

      <div class="space-y-1.5">
        <label for="password" class="block text-[12px] font-medium text-[#aaa398]">Password</label>
        <input id="password" class="field-input min-h-[42px]" placeholder="••••••••" required type="password" autocomplete="current-password"/>
      </div>

      <button id="login-btn" onclick="login()" class="w-full min-h-[44px] bg-[#10b981] hover:bg-[#34d399] text-[#042117] text-[14px] font-medium rounded-lg transition-colors active:scale-[0.98] flex items-center justify-center gap-2" type="button">
        <span id="btn-text">Sign in</span>
        <svg id="btn-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
      </button>
    </div>

    <div class="bg-[#12110f] px-6 py-4 border-t border-[#2c2925] text-center">
      <p class="text-[13px] text-[#aaa398]">
        New to ShariahEase?
        <a class="text-[#34d399] font-medium hover:underline" href="/auth/signup">Create account</a>
      </p>
    </div>
  </div>

  <!-- Footer Links -->
  <div class="mt-4 flex justify-center gap-5">
    <a class="text-[12px] text-[#8a847a] hover:text-[#efe9de] transition-colors" href="/privacy">Privacy</a>
    <a class="text-[12px] text-[#8a847a] hover:text-[#efe9de] transition-colors" href="/about">About</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (localStorage.getItem('se_token')) {
    window.location.href = '/';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const banner   = document.getElementById('error-banner');
    const btn      = document.getElementById('login-btn');
    const spinner  = document.getElementById('btn-spinner');
    const btnText  = document.getElementById('btn-text');

    banner.classList.add('hidden');

    if (!email || !password) {
      showError('Please fill in both fields.');
      return;
    }

    btn.disabled = true;
    spinner.classList.remove('hidden');
    btnText.textContent = 'Signing in…';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.detail || 'Login failed. Check your credentials.');
        return;
      }

      localStorage.setItem('se_token', data.access_token);
      localStorage.setItem('se_user',  JSON.stringify({ id: data.user_id, name: data.name, email: data.email }));

      window.location.href = '/';
    } catch (err) {
      showError('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      spinner.classList.add('hidden');
      btnText.textContent = 'Sign in';
    }
  }

  function showError(msg) {
    const banner = document.getElementById('error-banner');
    const bannerText = banner.querySelector('span');
    bannerText.textContent = msg;
    banner.classList.remove('hidden');
  }
</script>
{% endblock %}
