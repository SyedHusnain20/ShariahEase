<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{% block title %}Sign in — ShariahEase{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.png"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "background": "#161513",
            "surface": "#161513",
            "surface-container-lowest": "#12110f",
            "surface-container-low": "#191715",
            "surface-container": "#1c1a18",
            "surface-container-high": "#262421",
            "surface-variant": "#262421",
            "on-surface": "#efe9de",
            "on-surface-variant": "#aaa398",
            "outline": "#8a847a",
            "outline-variant": "#2c2925",
            "primary": "#34d399",
            "on-primary": "#042117",
            "primary-container": "#10b981",
            "on-primary-container": "#042117",
            "error": "#e5484d",
            "on-error": "#ffffff"
          },
          "borderRadius": { "DEFAULT": "0.5rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
          "spacing": { "gutter": "16px", "stack-sm": "4px", "margin-desktop": "32px", "margin-mobile": "16px", "stack-md": "8px", "stack-lg": "16px" },
          "fontFamily": {
            "sans": ["IBM Plex Sans", "system-ui", "-apple-system", "sans-serif"],
            "mono": ["IBM Plex Mono", "ui-monospace", "monospace"],
            "urdu-body": ["Noto Nastaliq Urdu", "serif"],
            "body-md": ["IBM Plex Sans", "system-ui", "sans-serif"],
            "label-md": ["IBM Plex Sans", "system-ui", "sans-serif"],
            "headline-md": ["IBM Plex Sans", "system-ui", "sans-serif"],
            "body-lg": ["IBM Plex Sans", "system-ui", "sans-serif"],
            "headline-lg": ["IBM Plex Sans", "system-ui", "sans-serif"]
          },
          "fontSize": {
            "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
            "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "500"}],
            "headline-lg": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "500"}]
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #161513;
      color: #efe9de;
      font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    input, textarea, select {
      background-color: #12110f !important;
      color: #efe9de !important;
      -webkit-text-fill-color: #efe9de !important;
      border-color: #2c2925 !important;
      caret-color: #34d399;
    }
    input::placeholder, textarea::placeholder {
      color: #6b655c !important;
      -webkit-text-fill-color: #6b655c !important;
      opacity: 1 !important;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 1px #10b981 !important;
      outline: none !important;
      background-color: #12110f !important;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #12110f inset !important;
      -webkit-text-fill-color: #efe9de !important;
      border-color: #2c2925 !important;
    }
  </style>
</head>
<body class="bg-[#161513] text-[#efe9de] min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
